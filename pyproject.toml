[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.10.3,<0.13" ]

[project]
name = "discogs-sdk"
version = "0.4.0"
description = "Modern Python client for the Discogs API"
readme = "README.md"
keywords = [ "api", "discogs", "music", "python", "sdk" ]
license = "Apache-2.0"
license-files = [ "LICENSE.txt" ]
authors = [ { name = "Jean-Marc Fontaine", email = "jm@jmfontaine.net" } ]
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.12",
  # KLUDGE: the Python 3.15 pydantic clause below pins a prerelease behind a
  # version cap. Both are temporary; see the replacement note at the end.
  #
  # pydantic 2.13 and earlier pin pydantic-core releases with no cp315 wheels,
  # so on Python 3.15 they have to be compiled from source, and that build is
  # rejected by the macOS dynamic loader (observed on macOS 27: the stripped
  # Mach-O it produces has a mis-aligned LINKEDIT string pool). 2.14 is the
  # first pydantic release whose pydantic-core pin (2.49) ships 3.15 wheels.
  #
  # The floors are additive, and the 3.15 one is pinned per minor version rather
  # than written as `>='3.15'`: uv_build rewrites that to `python_full_version
  # >= '3.15'`, and PEP 440 excludes prereleases from such a bound, so a 3.15
  # release candidate would silently fall back to the 2.12 floor. `=='3.15'`
  # survives as `python_full_version == '3.15.*'`, which does match 3.15.0rcN.
  #
  # Naming 2.14.0b2 also opts pydantic into prerelease selection, so a resolver
  # would otherwise prefer any newer pydantic prerelease over an older final.
  # `<2.15` bounds that to the 2.14 series: its betas, its release candidates
  # and, as soon as it exists, 2.14 final. The bound is temporary: once 2.14 is
  # released, rewrite the clause below as
  # `"pydantic>=2.14; python_version=='3.15'"` — the marker stays. Deleting the
  # clause outright would let a downstream constraint pull 2.13 back in on 3.15,
  # where it cannot install.
  "pydantic>=2.12",
  "pydantic>=2.14.0b2,<2.15; python_version=='3.15'",
  "typing-extensions>=4",
]
urls.Homepage = "https://github.com/jmfontaine/discogs-sdk"
urls.Issues = "https://github.com/jmfontaine/discogs-sdk/issues"
urls.Repository = "https://github.com/jmfontaine/discogs-sdk"

[dependency-groups]
dev = [
  "ast-comments>=1.2",
  # The API reference updater (scripts/update_api_docs.py). curl-cffi is here
  # for browser TLS impersonation; see the KLUDGE in that script.
  "beautifulsoup4>=4.13",
  "curl-cffi>=0.13",
  # KLUDGE: deadcode is deliberately absent here — scripts/check_dead_code.sh
  # pins it to deadcode==2.4.1 under Python 3.13, since 2.4.1 (its latest
  # release) uses the `ast.Str` alias removed in Python 3.14. Restore it as a
  # normal dev dependency once the tool runs on current Python.
  "deptry>=0.24",
  "markdownify>=1.2",
  "pre-commit>=4.4",
  "pyproject-fmt>=2.16.1",
  "pyright>=1.1.408",
  "ruff>=0.15.2",
  "ty>=0.0.17",
]
# KLUDGE: ty is declared twice — `just type-check` runs it as a dev tool, and
# tests/test_lazy_typing.py invokes `python -m ty` as part of the suite, which
# also has to work in an environment built from the test group alone. The two
# floors must stay identical; collapse the duplication if these groups ever
# share a common included group.
# pytest-asyncio floor is 1.4: it is the first version verified deprecation-
# clean on Python 3.15. The releases tested below it call asyncio APIs that
# 3.15 deprecates and marks as slated for removal in 3.16
# (`iscoroutinefunction` in 0.24, `AbstractEventLoopPolicy` in 1.0-1.3).
# pytest-httpx2 is respx's httpx2 companion (same author). Importing its plugin
# registers respx's "httpcore2" mocker, which is what `using="httpcore2"` in the
# test fixtures selects; respx's built-in mockers only target httpx/httpcore.
test = [
  "pytest>=8.3",
  "pytest-asyncio>=1.4",
  "pytest-cov>=6",
  "pytest-httpx2>=1",
  "respx>=0.22",
  "ty>=0.0.17",
]

[tool.ruff]
target-version = "py310"
line-length = 88
lint.per-file-ignores."examples/*" = [ "E402", "F811" ]
# __all__ is grouped by category with section comments; sorting it flattens
# the groups and strands the comments.
lint.per-file-ignores."src/discogs_sdk/__init__.py" = [ "RUF022" ]
# time.sleep lives in the `else` branch of an `if True:  # ASYNC` directive,
# which only the generated sync code keeps. See scripts/generate_sync.py.
lint.per-file-ignores."src/discogs_sdk/_async/_client.py" = [ "ASYNC251" ]

[tool.deptry]
per_rule_ignores.DEP001 = [ "tomllib" ]

[tool.pyproject-fmt]
column_width = 88
max_supported_python = "3.15"

[tool.ty]
rules.unused-ignore-comment = "ignore"

[tool.pytest]
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "-m 'not integration'"
ini_options.markers = [
  "integration: hits the real Discogs API",
  "unauthenticated: hits the real Discogs API with no credentials",
]
ini_options.asyncio_default_fixture_loop_scope = "function"
ini_options.asyncio_mode = "auto"

[tool.coverage]
run.source = [ "discogs_sdk" ]
report.skip_empty = true
report.show_missing = true

[tool.deadcode]
# The generated member declarations exist purely for type checkers.
exclude = [ "src/discogs_sdk/models/_lazy_fields.py" ]
# ``Seller`` extends ``UserSummary``, so the base name has to be listed too.
ignore_bodies_if_inherits_from = [ "SDKModel", "UserSummary" ]
ignore_names = [
  "_clean_discogs_env",
  "model_config",
  "prices",
  "pytestmark",
  "return_value",
]
