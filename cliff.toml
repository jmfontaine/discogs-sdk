[changelog]
# Not git-cliff's default, which is no header: an empty one starts the notes
# with a blank line, as every release so far has.
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}

    ## {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
            {{ commit.message | upper_first }} - \
            ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/jmfontaine/discogs-sdk/commit/{{ commit.id }}))
    {%- endfor %}
{% endfor %}
"""

[git]
commit_parsers = [
    # The version commits the release recipes make (and the older manual bumps)
    # mean nothing to users. First, since git-cliff stops at the first match.
    { message = "^chore: (release v[0-9]|start [0-9.]+ development|bump version to )", skip = true },
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore|^ci|^build", group = "Miscellaneous Tasks" },
    # Every other type, such as revert, so no conventional commit is left out.
    { message = ".*", group = "Other" },
]
tag_pattern = "v[0-9].*"
