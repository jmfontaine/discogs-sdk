name: Publish

on:
  push:
    tags: ["v*"]

# Every job gets a read-only token; the two that need more say so themselves,
# so nothing that installs and runs third-party code holds a write scope.
permissions:
  contents: read

jobs:
  guard:
    name: Tag guard
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and every branch, so origin/main is there to test
          # ancestry against.
          fetch-depth: 0
      - name: Check the tag matches the version and is on main
        # A tag pushed by hand would otherwise publish whatever version its
        # commit carries, from any branch. GITHUB_REF_NAME is read from the
        # environment, never expanded into the script.
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project.version $version in pyproject.toml"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $GITHUB_SHA, which is not on origin/main"
            exit 1
          fi

  ci:
    name: CI
    needs: [guard]
    # The release gate is the CI workflow itself, every job of it, so it can
    # never drift from what pull requests run. Its `dist` artifact belongs to
    # this run, which is where the publish job downloads it from.
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    needs: [guard, ci]
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: the job mints an OIDC token for the upload.
      id-token: write
    steps:
      - name: Download distributions
        # The exact artifacts the wheel and sdist jobs installed — never rebuilt
        # here, so what PyPI receives is what was tested.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github-release:
    name: GitHub Release
    runs-on: ubuntu-26.04
    needs: [publish]
    permissions:
      # gh release create needs to write the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as variables, never expanded into the script: a tag name may
          # contain characters the shell would interpret.
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.changelog.outputs.changelog }}
        run: gh release create "$TAG" --notes-file "$NOTES_FILE"
