name: Publish

on:
  push:
    tags: ["v*"]

# Every job gets a read-only token; the two that need more say so themselves,
# so nothing that installs and runs third-party code holds a write scope.
permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          # Jobs on the same Python otherwise compute the same cache key and
          # race to reserve it, which logs a warning in whichever loses.
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: Check sync codegen
        run: uv run python scripts/generate_sync.py --check
      - name: Check dead code
        run: scripts/check_dead_code.sh
      - name: Check pyproject.toml
        run: uv run pyproject-fmt --check pyproject.toml
      - name: Check formatting
        run: uv run ruff format --check
      - name: Lint
        run: uv run ruff check
      - name: Check types
        run: uv run ty check
      - name: Check unused dependencies
        run: uv run deptry src
      - name: Verify type completeness
        run: uv run pyright --ignoreexternal --verifytypes discogs_sdk

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups
      - name: Run tests
        run: uv run pytest --cov --cov-report=term-missing

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          cache-suffix: ${{ github.job }}
      - name: Build distributions
        run: uv build
      - name: Check distribution contents
        run: uv run --no-project python scripts/check_distributions.py dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  wheel:
    name: Wheel install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # The two branches of this project's own pydantic marker, plus the
        # oldest supported version. Transitive markers do differ across
        # 3.11-3.14, so widen this matrix if that resolution matters.
        python-version: ["3.10", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        # A clean environment outside the checkout, so the suite can only import
        # the installed package. Resolution comes from the wheel's published
        # metadata, which the lockfile-based test job never exercises.
        run: |
          uv venv --python ${{ matrix.python-version }} --seed /tmp/artifact-env
          /tmp/artifact-env/bin/python -m pip install --quiet dist/*.whl
      - name: Verify the package is imported from site-packages
        run: |
          /tmp/artifact-env/bin/python - <<'PY'
          import pathlib
          import sysconfig

          import discogs_sdk

          package = pathlib.Path(discogs_sdk.__file__).resolve()
          site_packages = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          if not package.is_relative_to(site_packages):
              raise SystemExit(f"discogs_sdk was imported from {package}, not from {site_packages}")
          print(f"import path ok: {package}")
          PY
      - name: Check what the wheel metadata resolved
        # Before the test stack lands: it pins shared dependencies such as httpx2
        # and would otherwise mask what the wheel itself selected.
        run: |
          /tmp/artifact-env/bin/python -m pip check
          /tmp/artifact-env/bin/python scripts/check_installed_package.py
      - name: Install the test stack
        run: |
          uv export --locked --only-group test --no-hashes --no-emit-project -o /tmp/test-requirements.txt
          /tmp/artifact-env/bin/python -m pip install --quiet -r /tmp/test-requirements.txt
      - name: Check the test environment
        run: /tmp/artifact-env/bin/python -m pip check
      - name: Run the test suite against the installed wheel
        run: /tmp/artifact-env/bin/python -m pytest --no-cov

  sdist:
    name: Sdist install (Python 3.15)
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: "3.15"
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Build and install the sdist
        run: |
          uv venv --python 3.15 --seed /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet dist/*.tar.gz
      - name: Check the resolved environment
        run: /tmp/sdist-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/sdist-env/bin/python scripts/check_installed_package.py

  publish:
    name: Publish
    runs-on: ubuntu-26.04
    needs: [quality, test, wheel, sdist]
    environment: pypi
    permissions:
      contents: read
      # PyPI trusted publishing: the job mints an OIDC token for the upload.
      id-token: write
    steps:
      - name: Download distributions
        # The exact artifacts the wheel and sdist jobs installed — never rebuilt
        # here, so what PyPI receives is what was tested.
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  github-release:
    name: GitHub Release
    runs-on: ubuntu-26.04
    needs: [publish]
    permissions:
      # gh release create needs to write the release.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          args: --latest
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed as variables, never expanded into the script: a tag name may
          # contain characters the shell would interpret.
          TAG: ${{ github.ref_name }}
          NOTES_FILE: ${{ steps.changelog.outputs.changelog }}
        run: gh release create "$TAG" --notes-file "$NOTES_FILE"
