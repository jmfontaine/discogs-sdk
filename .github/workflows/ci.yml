name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # publish.yml calls this workflow as its release gate, so a release runs every
  # job below. The caller's context applies: github.event_name is its `push`.
  workflow_call:

permissions:
  contents: read

# A pull request's runs share its ref, so a newer push cancels the older run.
# Every other run gets a group of its own commit, so no `main` commit is ever
# left without a result: a concurrency group holds only one pending run, so even
# `cancel-in-progress: false` would drop the middle one of three quick pushes.
# github.workflow keeps a release run (called from "Publish") apart from the
# `main` run of the same commit.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # No python-version here: uv reads the exact release from
          # .python-version, so the sync codegen check sees the same CPython as
          # local runs (ast.unparse output differs between patch releases).
          # Jobs on the same Python otherwise compute the same cache key and
          # race to reserve it, which logs a warning in whichever loses.
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run the pre-commit checks
        # The one list of fast checks, shared with `just qa` and the git hooks.
        # Hooks that fix files fail here when they change something, and the
        # diff shows what they changed.
        run: uv run pre-commit run --all-files --show-diff-on-failure
      - name: Verify type completeness
        run: uv run pyright --ignoreexternal --verifytypes discogs_sdk

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Install dependencies
        run: uv sync --locked --all-groups
      - name: Run tests
        run: uv run pytest --cov

  lowest:
    name: Lowest direct deps (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python: 3.15 also needs the
        # pytest-asyncio floor below to hold.
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          # Distinct from the other jobs on this Python for the reason above,
          # and because this one resolves a different dependency set.
          cache-suffix: ${{ github.job }}
      - name: Install the declared minimum dependencies
        # The lockfile always resolves newest, so the floors in pyproject.toml
        # are otherwise never exercised. Note this rewrites uv.lock in the
        # runner; never run it in a working tree you care about.
        run: uv sync --all-groups --resolution lowest-direct
      - name: Run tests
        # `--frozen` is required: plain `uv run` sees a `lowest-direct` lock
        # while defaulting to `highest`, re-resolves, and quietly reinstalls the
        # newest versions before the tests run.
        #
        # Deprecations are fatal here: the pytest-asyncio floor exists because
        # earlier releases call asyncio APIs Python 3.15 deprecates, and a plain
        # run would let that regress silently.
        run: uv run --frozen python -W error::DeprecationWarning -W error::PendingDeprecationWarning -m pytest --no-cov

  build:
    name: Build
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          cache-suffix: ${{ github.job }}
      - name: Build distributions
        run: uv build
      - name: Check distribution contents
        run: uv run --no-project python scripts/check_distributions.py dist
      - name: Check distribution metadata
        run: uvx twine check --strict dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  wheel:
    name: Wheel install (Python ${{ matrix.python-version }})
    runs-on: ubuntu-26.04
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        # The oldest and the newest supported Python. Transitive markers do
        # differ across 3.12-3.14, so widen this matrix if that resolution matters.
        python-version: ["3.11", "3.15"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: ${{ matrix.python-version }}
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Install the wheel
        # A clean environment outside the checkout, so the suite can only import
        # the installed package. Resolution comes from the wheel's published
        # metadata, which the lockfile-based test job never exercises.
        run: |
          uv venv --python ${{ matrix.python-version }} --seed /tmp/artifact-env
          /tmp/artifact-env/bin/python -m pip install --quiet dist/*.whl
      - name: Verify the package is imported from site-packages
        run: |
          /tmp/artifact-env/bin/python - <<'PY'
          import pathlib
          import sysconfig

          import discogs_sdk

          package = pathlib.Path(discogs_sdk.__file__).resolve()
          site_packages = pathlib.Path(sysconfig.get_paths()["purelib"]).resolve()
          if not package.is_relative_to(site_packages):
              raise SystemExit(f"discogs_sdk was imported from {package}, not from {site_packages}")
          print(f"import path ok: {package}")
          PY
      - name: Check what the wheel metadata resolved
        # Before the test stack lands: it pins shared dependencies such as httpx2
        # and would otherwise mask what the wheel itself selected.
        run: |
          /tmp/artifact-env/bin/python -m pip check
          /tmp/artifact-env/bin/python scripts/check_installed_package.py
      - name: Install the test stack
        run: |
          uv export --locked --only-group test --no-hashes --no-emit-project -o /tmp/test-requirements.txt
          /tmp/artifact-env/bin/python -m pip install --quiet -r /tmp/test-requirements.txt
      - name: Check the test environment
        run: /tmp/artifact-env/bin/python -m pip check
      - name: Run the test suite against the installed wheel
        run: /tmp/artifact-env/bin/python -m pytest --no-cov

  sdist:
    name: Sdist install (Python 3.15)
    runs-on: ubuntu-26.04
    needs: [build]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.15"
          cache-suffix: ${{ github.job }}
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Build and install the sdist
        run: |
          uv venv --python 3.15 --seed /tmp/sdist-env
          /tmp/sdist-env/bin/python -m pip install --quiet dist/*.tar.gz
      - name: Check the resolved environment
        run: /tmp/sdist-env/bin/python -m pip check
      - name: Check the installed package
        run: /tmp/sdist-env/bin/python scripts/check_installed_package.py

  # The one status check `main` requires. It needs every job above, so adding,
  # renaming or resizing a job (or a matrix) never touches the ruleset. Keep its
  # `needs` in step with the jobs.
  ci-passed:
    name: CI passed
    needs: [build, lowest, quality, sdist, test, wheel]
    if: always()
    runs-on: ubuntu-26.04
    steps:
      - name: Fail unless every job passed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
