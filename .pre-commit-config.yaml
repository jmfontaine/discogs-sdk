repos:
  # General
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-toml
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Every tool below runs through `uv run`, so uv.lock is its only version source
  # and the hooks, `just` and CI can never disagree about a tool's version. The
  # one exception is dead-code, which scripts/check_dead_code.sh pins itself.
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        # The same file types as the upstream ruff hooks these replace.
        types_or: [python, pyi, jupyter, markdown]
        require_serial: true

      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types_or: [python, pyi, jupyter]
        require_serial: true

      - id: pyproject-fmt
        name: pyproject-fmt
        entry: uv run pyproject-fmt
        language: system
        files: ^pyproject\.toml$

      - id: sync-codegen-check
        name: sync-codegen-check
        entry: uv run python scripts/generate_sync.py --check
        language: system
        # .python-version: generated output depends on the pinned patch release.
        files: ^(src/discogs_sdk/(_async|_sync|models)/|scripts/generate_sync\.py$|\.python-version$)
        pass_filenames: false

      - id: endpoints-check
        name: endpoints-check
        entry: uv run python scripts/generate_endpoints.py --check
        language: system
        files: ^(src/discogs_sdk/(_async/|oauth\.py$)|docs/endpoints\.md$|scripts/generate_endpoints\.py$)
        pass_filenames: false

      - id: skill-refs-check
        name: skill-refs-check
        entry: uv run python scripts/generate_skill_refs.py --check
        language: system
        # Every docs page, not only the copied ones (their links are rewritten
        # against the rest), and pyproject.toml for the version links pin to.
        files: ^(docs/|src/discogs_sdk/\.agents/skills/discogs-sdk/references/|pyproject\.toml$|scripts/generate_skill_refs\.py$)
        pass_filenames: false

      - id: dead-code
        name: dead-code
        entry: scripts/check_dead_code.sh
        language: system
        types: [python]
        pass_filenames: false

      - id: deps-unused
        name: deps-unused
        entry: uv run deptry src
        language: system
        types: [python]
        pass_filenames: false

      - id: type-check
        name: type-check
        entry: uv run ty check
        language: system
        types: [python]
        pass_filenames: false
